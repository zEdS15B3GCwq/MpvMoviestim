[project]
name = "mpvmoviestim"
version = "0.1.0"
description = "LibMPV-based moviestim class for PsychoPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mpv>=1.0.8",
    "pyglet>=1.4,<2",
    "psychopy>=2025.2.4",
]

[[tool.mypy.overrides]]
module = ["pyglet.*", "psychopy.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["mpv.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.9"
